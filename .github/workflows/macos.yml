name: VinaKey macOS candidate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Rust tests and lint
        run: |
          cargo test --locked --manifest-path Sources/OpenKey/engine-rust/Cargo.toml
          cargo clippy --locked --manifest-path Sources/OpenKey/engine-rust/Cargo.toml --all-targets -- -D warnings
      - name: Reference traces and native regression checks
        run: |
          python3 scripts/check-rust-engine.py
          sh scripts/check-macos-input.sh
      - name: Build local preview (not a public release)
        run: python3 scripts/package-macos.py --output "$RUNNER_TEMP/vinakey-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: VinaKey-local-preview
          path: ${{ runner.temp }}/vinakey-candidate/
          if-no-files-found: error
